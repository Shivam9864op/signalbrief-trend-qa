    <text x="885" y="338" fill="#b5c5d9" font-size="18">claims + safety</text>
    <text x="885" y="371" fill="#b5c5d9" font-size="18">rights checked</text>
    <text x="885" y="404" fill="#b5c5d9" font-size="18">region + channels</text>
